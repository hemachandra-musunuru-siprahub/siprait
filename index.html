<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="9O8Dg1JPGZOvU-su6G7VPC0zKrfaYZPfpeoRF6IsM14" />

    <title>SipraHub</title>
  </head>

  <body>
    <div id="root"></div>
    <!-- Hidden form for Netlify build bots to detect the form fields -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="service" />
      <textarea name="project"></textarea>
      <input type="text" name="contact_time" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
